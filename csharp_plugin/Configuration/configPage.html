<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>Smart Branching</title>
</head>
<body>
    <div id="smartBranchingConfigPage" data-role="page" class="page type-interior pluginConfigurationPage" data-require="emby-input,emby-button,emby-checkbox">
        <div data-role="content">
            <div class="content-primary">
                <form id="smartBranchingConfigForm">
                    <div class="verticalSection verticalSection-extrabottompadding">
                        <h3 class="headingKey cardHeading">Smart Branching</h3>
                        <p class="fieldDescription">
                            Click a cell to mark a topic as avoided for that user.
                            Skip vs swap is that user's action when a labeled scene hits.
                            Swap uses replacement clips already in the BVF; if none exist, it skips.
                        </p>
                        <div class="inputContainer">
                            <label class="emby-checkbox-label">
                                <input is="emby-checkbox" id="enableSmartBranching" type="checkbox" />
                                <span>Enable Smart Branching</span>
                            </label>
                        </div>
                    </div>

                    <div class="verticalSection verticalSection-extrabottompadding">
                        <h3 class="headingKey cardHeading">Avoided topics</h3>
                        <div id="userTopicList">
                            <p>Loading users...</p>
                        </div>
                    </div>

                    <div>
                        <button is="emby-button" type="submit" class="raised button-submit block emby-button">
                            <span>Save</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>

        <style>
            .sb-grid-wrap { overflow-x: auto; margin: 0.5em 0 1em; }
            .sb-grid { border-collapse: collapse; width: max-content; min-width: 100%; font-size: 0.92em; }
            .sb-grid th, .sb-grid td { padding: 0.35em 0.7em; border-bottom: 1px solid rgba(128,128,128,0.25); }
            .sb-grid thead th { position: sticky; top: 0; z-index: 1; font-weight: 600; text-align: center; white-space: nowrap; }
            .sb-grid .sb-topic { text-align: left; white-space: nowrap; padding-left: 0.2em; }
            .sb-grid .sb-group td { font-weight: 650; padding-top: 0.9em; padding-bottom: 0.25em; opacity: 0.8; border-bottom: none; }
            .sb-cell { text-align: center; cursor: pointer; user-select: none; min-width: 4.5em; }
            .sb-cell button {
                width: 1.6em; height: 1.6em; border-radius: 4px; border: 1px solid rgba(128,128,128,0.45);
                background: transparent; color: inherit; cursor: pointer; padding: 0; line-height: 1.5em;
            }
            .sb-cell button[aria-pressed="true"] { background: #3fa34d; border-color: #3fa34d; color: #fff; }
            .sb-hit { display: flex; gap: 0.25em; justify-content: center; }
            .sb-hit-action {
                font-size: 0.78em; padding: 0.15em 0.45em; border-radius: 4px;
                border: 1px solid rgba(128,128,128,0.45); background: transparent;
                color: inherit; cursor: pointer; line-height: 1.4;
            }
            .sb-hit-action[aria-pressed="true"] { background: #3fa34d; border-color: #3fa34d; color: #fff; }
            .sb-hit-row th { font-weight: 500; font-size: 0.85em; }
            .sb-add { display: flex; gap: 0.5em; align-items: end; max-width: 28em; }
            .sb-topic-label { display: inline-flex; align-items: center; gap: 0.4em; }
            .sb-remove-topic {
                width: 1.4em; height: 1.4em; border-radius: 4px; border: 1px solid rgba(128,128,128,0.45);
                background: transparent; color: inherit; cursor: pointer; padding: 0; line-height: 1.2em;
                font-size: 1.1em; opacity: 0.75;
            }
            .sb-remove-topic:hover { opacity: 1; border-color: #c44; color: #c44; }
        </style>

        <script type="text/javascript">
            (function () {
                var pluginUniqueId = 'a1b2c3d4-e5f6-7890-abcd-ef1234567890';
                var _loadingConfig = false;
                var TOPIC_GROUPS = [
                    { name: 'Mature', topics: ['nudity', 'language', 'profanity', 'violence', 'gore', 'fear', 'sex_education', 'violence_domestic', 'self_harm'] },
                    { name: 'Substances', topics: ['drugs', 'alcohol', 'smoking'] },
                    { name: 'Beliefs & identity', topics: ['religion_christianity', 'religion_general', 'politics', 'feminism', 'masculinity', 'lgbtq', 'racism'] },
                    { name: 'Other', topics: ['war_military', 'mental_health', 'death_grief', 'crime'] }
                ];
                var KNOWN_TOPICS = [];
                TOPIC_GROUPS.forEach(function (group) {
                    group.topics.forEach(function (topic) { KNOWN_TOPICS.push(topic); });
                });

                var _users = [];
                var _selected = {};
                var _hitAction = {};
                var _extraTopics = [];

                function getElement(selector) {
                    return document.querySelector(selector);
                }

                function showError(message) {
                    var host = getElement('#userTopicList');
                    if (host) {
                        host.innerHTML = '<p style="color:red">' + escapeHtml(message) + '</p>';
                    }
                    if (window.Dashboard && typeof Dashboard.alert === 'function') {
                        Dashboard.alert(message);
                    }
                }

                function escapeHtml(value) {
                    return String(value || '')
                        .replace(/&/g, '&amp;')
                        .replace(/</g, '&lt;')
                        .replace(/>/g, '&gt;')
                        .replace(/"/g, '&quot;');
                }

                function normalizeTopics(topics) {
                    if (Array.isArray(topics)) {
                        return topics.map(function (part) { return String(part).trim(); }).filter(Boolean);
                    }
                    if (typeof topics === 'string') {
                        return topics.split(',').map(function (part) { return part.trim(); }).filter(Boolean);
                    }
                    return [];
                }

                function normalizeHitAction(value, fallback) {
                    var raw = String(value || fallback || 'skip').trim().toLowerCase();
                    return raw === 'swap' ? 'swap' : 'skip';
                }

                function hitActionForUser(userId) {
                    return normalizeHitAction(_hitAction[userId], 'skip');
                }

                function setHitAction(userId, action) {
                    _hitAction[userId] = normalizeHitAction(action, 'skip');
                    document.querySelectorAll('.sb-hit-action[data-user="' + cssEscape(userId) + '"]').forEach(function (button) {
                        var on = button.getAttribute('data-action') === _hitAction[userId];
                        button.setAttribute('aria-pressed', on ? 'true' : 'false');
                    });
                }

                function hitActionHtml(userId) {
                    var current = hitActionForUser(userId);
                    function btn(action, label) {
                        var on = current === action;
                        return '<button type="button" class="sb-hit-action" data-user="' + escapeHtml(userId) +
                            '" data-action="' + action + '" aria-pressed="' + (on ? 'true' : 'false') +
                            '" title="' + label + ' when an avoided topic is on screen">' + label + '</button>';
                    }
                    return '<div class="sb-hit">' + btn('skip', 'Skip') + btn('swap', 'Swap') + '</div>';
                }

                function isOn(userId, topic) {
                    var set = _selected[userId];
                    return !!(set && set[topic]);
                }

                function toggleCell(userId, topic) {
                    if (!_selected[userId]) {
                        _selected[userId] = {};
                    }
                    if (_selected[userId][topic]) {
                        delete _selected[userId][topic];
                    } else {
                        _selected[userId][topic] = true;
                    }
                    var button = document.querySelector('.sb-toggle[data-user="' + cssEscape(userId) + '"][data-topic="' + cssEscape(topic) + '"]');
                    if (button) {
                        var on = isOn(userId, topic);
                        button.setAttribute('aria-pressed', on ? 'true' : 'false');
                        button.textContent = on ? '✓' : '';
                    }
                }

                function cellHtml(userId, topic) {
                    var on = isOn(userId, topic);
                    return '<td class="sb-cell"><button type="button" class="sb-toggle" data-user="' + escapeHtml(userId) +
                        '" data-topic="' + escapeHtml(topic) + '" aria-pressed="' + (on ? 'true' : 'false') +
                        '" title="' + escapeHtml(topic) + '">' + (on ? '✓' : '') + '</button></td>';
                }

                function extraTopicsFromState() {
                    var extras = [];
                    var seen = {};
                    function add(topic) {
                        if (!topic || KNOWN_TOPICS.indexOf(topic) !== -1 || seen[topic]) {
                            return;
                        }
                        seen[topic] = true;
                        extras.push(topic);
                    }
                    _extraTopics.forEach(add);
                    Object.keys(_selected).forEach(function (userId) {
                        Object.keys(_selected[userId]).forEach(add);
                    });
                    extras.sort();
                    return extras;
                }

                function addCustomTopic(raw) {
                    var topic = String(raw || '').trim();
                    if (!topic) {
                        return;
                    }
                    if (KNOWN_TOPICS.indexOf(topic) === -1 && _extraTopics.indexOf(topic) === -1) {
                        _extraTopics.push(topic);
                    }
                    renderGrid();
                    var row = document.querySelector('.sb-topic[data-topic-label="' + cssEscape(topic) + '"]');
                    if (row && row.scrollIntoView) {
                        row.scrollIntoView({ block: 'center' });
                    }
                }

                function removeCustomTopic(topic) {
                    topic = String(topic || '').trim();
                    if (!topic || KNOWN_TOPICS.indexOf(topic) !== -1) {
                        return;
                    }
                    _extraTopics = _extraTopics.filter(function (item) { return item !== topic; });
                    Object.keys(_selected).forEach(function (userId) {
                        if (_selected[userId]) {
                            delete _selected[userId][topic];
                        }
                    });
                    renderGrid();
                }

                function cssEscape(value) {
                    if (window.CSS && typeof CSS.escape === 'function') {
                        return CSS.escape(value);
                    }
                    return String(value).replace(/[^a-zA-Z0-9_-]/g, '\\$&');
                }

                function renderGrid() {
                    var host = getElement('#userTopicList');
                    if (!host) {
                        return;
                    }
                    if (_users.length === 0) {
                        host.innerHTML = '<p>No users found</p>';
                        return;
                    }

                    var extras = extraTopicsFromState();
                    var head = '<th class="sb-topic">Topic</th>';
                    var hitHead = '<th class="sb-topic">On a hit</th>';
                    _users.forEach(function (user) {
                        head += '<th>' + escapeHtml(user.Name || user.Id) + '</th>';
                        hitHead += '<th>' + hitActionHtml(user.Id) + '</th>';
                    });

                    var body = '';
                    function addRows(topics, removable) {
                        topics.forEach(function (topic) {
                            var remove = removable
                                ? '<button type="button" class="sb-remove-topic" data-topic="' + escapeHtml(topic) +
                                  '" title="Remove custom topic" aria-label="Remove ' + escapeHtml(topic) + '">×</button>'
                                : '';
                            var row = '<tr><th class="sb-topic" scope="row" data-topic-label="' + escapeHtml(topic) +
                                '"><span class="sb-topic-label">' + escapeHtml(topic) + remove + '</span></th>';
                            _users.forEach(function (user) {
                                row += cellHtml(user.Id, topic);
                            });
                            body += row + '</tr>';
                        });
                    }

                    TOPIC_GROUPS.forEach(function (group) {
                        body += '<tr class="sb-group"><td colspan="' + (_users.length + 1) + '">' + escapeHtml(group.name) + '</td></tr>';
                        addRows(group.topics);
                    });
                    body += '<tr class="sb-group"><td colspan="' + (_users.length + 1) + '">Custom</td></tr>';
                    if (extras.length) {
                        addRows(extras, true);
                    } else {
                        body += '<tr><td class="sb-topic" colspan="' + (_users.length + 1) + '" style="opacity:0.65">None yet — add one below</td></tr>';
                    }

                    host.innerHTML =
                        '<div class="sb-grid-wrap"><table class="sb-grid"><thead><tr>' + head +
                        '</tr><tr class="sb-hit-row">' + hitHead + '</tr></thead><tbody>' + body + '</tbody></table></div>' +
                        '<div class="sb-add inputContainer">' +
                        '<div><label class="inputLabel" for="sbAddTopic">Add a custom topic</label>' +
                        '<input id="sbAddTopic" type="text" class="emby-input" placeholder="e.g. spoilers" autocomplete="off" /></div>' +
                        '<button type="button" class="raised emby-button" id="sbAddTopicBtn">Add</button>' +
                        '</div>';
                }

                function topicsForUser(userId) {
                    var set = _selected[userId] || {};
                    return Object.keys(set).sort();
                }

                function normalizeUsersResponse(response) {
                    if (Array.isArray(response)) {
                        return response;
                    }
                    if (response && Array.isArray(response.Items)) {
                        return response.Items;
                    }
                    return [];
                }

                function loadUsers(savedConfig) {
                    var host = getElement('#userTopicList');
                    if (!host) {
                        return Promise.resolve();
                    }
                    if (!window.ApiClient || typeof ApiClient.getUsers !== 'function') {
                        showError('API does not support user lookup');
                        return Promise.resolve();
                    }

                    var stored = {};
                    if (savedConfig && Array.isArray(savedConfig.UserProfileEntries)) {
                        savedConfig.UserProfileEntries.forEach(function (entry) {
                            if (entry && entry.UserId && entry.Profile) {
                                stored[entry.UserId] = entry.Profile;
                            }
                        });
                    }

                    var timerId = null;
                    var timeoutPromise = new Promise(function (_, reject) {
                        timerId = setTimeout(function () {
                            reject(new Error('getUsers timed out after 5s'));
                        }, 5000);
                    });

                    return Promise.race([ApiClient.getUsers(), timeoutPromise])
                        .then(function (response) {
                            if (timerId) {
                                clearTimeout(timerId);
                            }
                            _users = normalizeUsersResponse(response);
                            _selected = {};
                            _hitAction = {};
                            _extraTopics = normalizeTopics(
                                (savedConfig && (savedConfig.CustomTopics || savedConfig.customTopics)) || []
                            );
                            var defaultHit = normalizeHitAction(
                                savedConfig && (savedConfig.DefaultAction || savedConfig.defaultAction),
                                'skip'
                            );
                            _users.forEach(function (user) {
                                var profile = stored[user.Id] || {};
                                _selected[user.Id] = {};
                                _hitAction[user.Id] = normalizeHitAction(
                                    profile.HitAction || profile.hitAction,
                                    defaultHit
                                );
                                normalizeTopics(profile.Topics).forEach(function (topic) {
                                    _selected[user.Id][topic] = true;
                                });
                            });
                            renderGrid();
                        })
                        .catch(function (err) {
                            if (timerId) {
                                clearTimeout(timerId);
                            }
                            showError('Failed to load users: ' + (err && err.message ? err.message : 'unknown error'));
                        });
                }

                function loadConfig() {
                    if (_loadingConfig) {
                        return;
                    }
                    if (!window.ApiClient || typeof ApiClient.getPluginConfiguration !== 'function') {
                        showError('API client not available');
                        return;
                    }

                    _loadingConfig = true;
                    if (window.Dashboard && typeof Dashboard.showLoadingMsg === 'function') {
                        Dashboard.showLoadingMsg();
                    }

                    ApiClient.getPluginConfiguration(pluginUniqueId)
                        .then(function (config) {
                            if (!getElement('#smartBranchingConfigForm')) {
                                throw new Error('Config page not available');
                            }
                            getElement('#enableSmartBranching').checked = config.Enabled !== false;
                            return loadUsers(config);
                        })
                        .catch(function (err) {
                            showError('Failed to load Smart Branching settings: ' + (err && err.message ? err.message : 'unknown error'));
                        })
                        .finally(function () {
                            if (window.Dashboard && typeof Dashboard.hideLoadingMsg === 'function') {
                                Dashboard.hideLoadingMsg();
                            }
                            _loadingConfig = false;
                        });
                }

                function saveConfig(e) {
                    if (e && e.preventDefault) {
                        e.preventDefault();
                    }
                    if (!window.ApiClient || typeof ApiClient.updatePluginConfiguration !== 'function') {
                        showError('API client not available');
                        return false;
                    }
                    if (window.Dashboard && typeof Dashboard.showLoadingMsg === 'function') {
                        Dashboard.showLoadingMsg();
                    }

                    ApiClient.getPluginConfiguration(pluginUniqueId)
                        .then(function (config) {
                            config.Enabled = getElement('#enableSmartBranching').checked;
                            var existing = {};
                            if (Array.isArray(config.UserProfileEntries)) {
                                config.UserProfileEntries.forEach(function (entry) {
                                    if (entry && entry.UserId && entry.Profile) {
                                        existing[entry.UserId] = entry.Profile;
                                    }
                                });
                            }
                            var entries = _users.map(function (user) {
                                var previous = existing[user.Id] || {};
                                return {
                                    UserId: user.Id,
                                    Profile: {
                                        Birthday: previous.Birthday || null,
                                        Sex: previous.Sex || 'unset',
                                        ProfileOverride: previous.ProfileOverride || null,
                                        Topics: topicsForUser(user.Id),
                                        HitAction: hitActionForUser(user.Id)
                                    }
                                };
                            });
                            config.UserProfileEntries = entries;
                            config.CustomTopics = extraTopicsFromState();
                            delete config.UserProfiles;
                            return ApiClient.updatePluginConfiguration(pluginUniqueId, config);
                        })
                        .then(function (result) {
                            if (window.Dashboard && typeof Dashboard.processPluginConfigurationUpdateResult === 'function') {
                                Dashboard.processPluginConfigurationUpdateResult(result);
                            }
                        })
                        .catch(function () {
                            showError('Failed to save Smart Branching settings.');
                        })
                        .finally(function () {
                            if (window.Dashboard && typeof Dashboard.hideLoadingMsg === 'function') {
                                Dashboard.hideLoadingMsg();
                            }
                        });

                    return false;
                }

                var page = getElement('#smartBranchingConfigPage');
                if (page) {
                    page.addEventListener('pageshow', loadConfig);
                }
                var form = getElement('#smartBranchingConfigForm');
                if (form) {
                    form.addEventListener('submit', saveConfig);
                    form.addEventListener('click', function (e) {
                        var toggle = e.target.closest && e.target.closest('.sb-toggle');
                        if (toggle) {
                            e.preventDefault();
                            toggleCell(toggle.getAttribute('data-user'), toggle.getAttribute('data-topic'));
                            return;
                        }
                        var hit = e.target.closest && e.target.closest('.sb-hit-action');
                        if (hit) {
                            e.preventDefault();
                            setHitAction(hit.getAttribute('data-user'), hit.getAttribute('data-action'));
                            return;
                        }
                        if (e.target.closest && e.target.closest('.sb-remove-topic')) {
                            e.preventDefault();
                            removeCustomTopic(e.target.closest('.sb-remove-topic').getAttribute('data-topic'));
                            return;
                        }
                        if (e.target.closest && e.target.closest('#sbAddTopicBtn')) {
                            e.preventDefault();
                            var input = getElement('#sbAddTopic');
                            addCustomTopic(input && input.value);
                            if (input) {
                                input.value = '';
                            }
                        }
                    });
                    form.addEventListener('keydown', function (e) {
                        if (e.key !== 'Enter') {
                            return;
                        }
                        if (e.target && e.target.id === 'sbAddTopic') {
                            e.preventDefault();
                            addCustomTopic(e.target.value);
                            e.target.value = '';
                        }
                    });
                }
            })();
        </script>
    </div>
</body>
</html>
